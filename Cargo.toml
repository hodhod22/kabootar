[package]
name = "kabootar"
version = "2.1.0"
edition = "2021"
description = "Kabootar — fullstack programming language (formerly Nova)"
authors = ["Kabootar Contributors"]
license = "MIT"
build = "build.rs"

[lints.rust]
dead_code = "allow"

[lib]
# Distinct from [[bin]] name "kabootar" — avoids kabootar.pdb collision on Windows (cargo#6313).
crate-type = ["cdylib", "rlib"]
name = "kabootar_lib"

[[bin]]
name = "kabootar"
path = "src/main.rs"
required-features = ["default"]
test = false
bench = false

[[bin]]
name = "kabootar-lsp"
path = "src/bin/kabootar-lsp.rs"
required-features = ["lsp"]

[[bin]]
name = "kabootar-docai"
path = "src/bin/kabootar-docai.rs"
required-features = ["docai"]

[[bin]]
name = "kabootar-codai"
path = "src/bin/kabootar-codai.rs"
required-features = ["codai"]

[[bin]]
name = "kabootar-shell"
path = "src/bin/kabootar-shell.rs"
required-features = ["shell"]

[dependencies]
wasm-bindgen = "0.2"
tower-lsp = { version = "0.20", optional = true }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "io-std"], optional = true }
aes-gcm = { version = "0.10", optional = true }
chacha20poly1305 = { version = "0.10", optional = true }
sha3 = { version = "0.10", optional = true }
argon2 = { version = "0.5", optional = true }
rsa = { version = "0.9", features = ["sha2"], optional = true }
p256 = { version = "0.13", features = ["ecdsa"], optional = true }
rand = { version = "0.8", optional = true }
zeroize = { version = "1.8", features = ["zeroize_derive"], optional = true }
getrandom = { version = "0.2", features = ["js"], optional = true }
fontdue = { version = "0.9.3" }
unicode-normalization = "0.1"
num-bigint = "0.4"
num-traits = "0.2"
fancy-regex = "0.14"
regex = "1"
serde_json = "1"
png = "0.17"
# SC4a — BLAS-class DGEMM (pure Rust SIMD kernels; API-compatible with cblas dgemm)
matrixmultiply = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
rustls-pemfile = "2"
sha2 = "0.10"
sha1 = "0.10"
winit = { version = "0.29", optional = true }
softbuffer = { version = "0.4", optional = true }
wgpu = { version = "24", optional = true }
pollster = { version = "0.4", optional = true }
cpal = { version = "0.15", optional = true }
serialport = { version = "4.7", optional = true }
nusb = { version = "0.2", optional = true }
hidapi = { version = "2.6", optional = true }
wasmi = { version = "0.32", default-features = false, features = ["std"] }
libloading = "0.8"
flate2 = "1"
tar = "0.4"
rustyline = "14"
# DATA/SC — Apache Parquet (host); KPQT1 remains for .kpqt / wasm
parquet = { version = "54", default-features = false, features = ["arrow", "snap"] }
arrow-array = { version = "54", default-features = false }
arrow-schema = { version = "54", default-features = false }
cranelift = "0.116"
cranelift-jit = "0.116"
cranelift-module = "0.116"
cranelift-native = "0.116"
memmap2 = "0.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Document", "Window", "Element", "HtmlElement", "HtmlIFrameElement", "Node", "HtmlCollection", "HtmlCanvasElement", "CanvasRenderingContext2d"] }
js-sys = "0.3"

[dev-dependencies]
rcgen = "0.13"

[features]
default = ["crypto", "docai", "codai"]
docai = []
codai = []
crypto = [
    "dep:aes-gcm",
    "dep:chacha20poly1305",
    "dep:sha3",
    "dep:argon2",
    "dep:rsa",
    "dep:p256",
    "dep:rand",
    "dep:zeroize",
    "dep:getrandom",
]
lsp = ["dep:tower-lsp", "dep:tokio"]
shell = ["dep:winit", "dep:softbuffer"]
gpu = ["dep:wgpu", "dep:pollster"]
hw = ["dep:cpal", "dep:serialport", "dep:nusb", "dep:hidapi"]
