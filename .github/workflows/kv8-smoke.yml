name: Kv8 smoke

on:
  push:
    paths:
      - "src/runtime/kv8/**"
      - "tests/kv8_smoke.rs"
      - "fixtures/kv8/**"
      - "scripts/kv8-test-*.sh"
  pull_request:
    paths:
      - "src/runtime/kv8/**"
      - "tests/kv8_smoke.rs"
      - "fixtures/kv8/**"
      - "scripts/kv8-test-*.sh"

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: bash scripts/kv8-test-fast.sh

  slow:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: bash scripts/kv8-test-slow.sh
